title: "[AIP Idea] "
labels: ["status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this discussion to propose an early AAO Improvement Proposal idea before opening a formal AIP Pull Request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this idea solve?
      placeholder: Describe the issue, limitation, risk, or missing capability.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: What should be added, changed, removed, or standardized?
    validations:
      required: true

  - type: textarea
    id: security-considerations
    attributes:
      label: Security considerations
      description: What could go wrong?
    validations:
      required: true
      
